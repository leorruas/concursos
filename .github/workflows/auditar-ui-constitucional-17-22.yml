name: Auditoria visual dos artigos constitucionais 17 a 22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auditar-ui-constitucional-17-22.yml'
      - 'scripts/qa-camara-articles-browser.py'
      - '3 - Materias/Direito Constitucional/17 - sancao veto promulgacao e publicacao.md'
      - '3 - Materias/Direito Constitucional/18 - procedimentos abreviado e sumario.md'
      - '3 - Materias/Direito Constitucional/19 - procedimentos sumarissimo especial e concentrado.md'
      - '3 - Materias/Direito Constitucional/20 - lei delegada e delegacao legislativa.md'
      - '3 - Materias/Direito Constitucional/21 - medida provisoria pressupostos prazos e efeitos.md'
      - '3 - Materias/Direito Constitucional/22 - projetos de decreto legislativo e resolucao.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Abrir seis rotas no Chrome e registrar telas
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependência de navegador
        run: python -m pip install 'selenium>=4,<5'
      - name: Capturar desktop claro e mobile escuro com espera do DOM
        run: python scripts/qa-camara-articles-browser.py
      - name: Guardar evidências para inspeção visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: constitucional-17-22-capturas
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14
