name: Ingest advances 2026-09-14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ingest-avancos-2026-09-14.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch advances and performance logs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          DATE = "2026-09-14"

          def read(path):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f"Arquivo esperado não encontrado: {path}")
              return p.read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def update_frontmatter(text):
              new, n = re.subn(r'(?m)^updated: \d{4}-\d{2}-\d{2}$', f'updated: {DATE}', text, count=1)
              if n == 0:
                  raise SystemExit("Frontmatter sem campo updated")
              return new

          def insert_table_row(text, heading, row, unique):
              if unique in text:
                  return text
              start = text.find(heading)
              if start < 0:
                  raise SystemExit(f"Cabeçalho não encontrado: {heading}")
              sep = text.find('| :---', start)
              if sep < 0:
                  raise SystemExit(f"Separador de tabela não encontrado após: {heading}")
              end = text.find('\n', sep)
              if end < 0:
                  end = len(text)
              else:
                  end += 1
              return text[:end] + row.rstrip() + '\n' + text[end:]

          def insert_after_heading(text, heading, block, unique):
              if unique in text:
                  return text
              pos = text.find(heading)
              if pos < 0:
                  raise SystemExit(f"Cabeçalho não encontrado: {heading}")
              pos += len(heading)
              while pos < len(text) and text[pos] == '\n':
                  pos += 1
              return text[:pos] + '\n\n' + block.strip() + '\n\n' + text[pos:]

          def ensure_weekly_section(text, row, unique):
              if unique in text:
                  return text
              if '## Aproveitamento semanal' in text:
                  return insert_table_row(text, '## Aproveitamento semanal', row, unique)
              anchor = '\n---\n\n## Diagnósticos de desempenho'
              if anchor not in text:
                  raise SystemExit('Âncora para inserir aproveitamento semanal não encontrada')
              section = (
                  '\n\n## Aproveitamento semanal\n\n'
                  '| Semana / Período | Questões | Aproveitamento | Evolução / Análise de Progresso |\n'
                  '| :--- | :--- | :--- | :--- |\n'
                  + row.rstrip() + '\n'
              )
              return text.replace(anchor, section + anchor, 1)

          # Lógica
          path = '3 - Materias/Logica/Avancos.md'
          text = update_frontmatter(read(path))
          text = insert_table_row(
              text,
              '## Volume diário de exercícios',
              '| 14/09/2026 | 6 | Raciocínio Lógico | Ingestão de Inbox: bateria mista de quantificadores, proposições, inferência categórica, De Morgan e condicional: 5/6 acertos (83,3%). Erro único na negação de “nenhum” [C]. |',
              '14/09/2026 | 6 | Raciocínio Lógico'
          )
          text = ensure_weekly_section(
              text,
              '| **Semana 38** (14/09 a 20/09) | 6 | 83,3% (5/6) | Retenção ampla preservada. Erro isolado de confusão conceitual na negação de quantificador negativo: `Nenhum A é B` → `Algum A é B`; evitar nova bateria massiva e reapresentar a fronteira de forma misturada. |',
              '**Semana 38** (14/09 a 20/09) | 6 | 83,3% (5/6)'
          )
          logic_block = '''### Diagnóstico de bateria mista — quantificadores, proposições e condicional (14/09/2026)
- **Resultado:** 83,3% (5/6 acertos válidos).
- **Evidências positivas:** interpretação correta de `algum` como existência mínima; distinção entre proposição e sentença aberta; inferência existencial sem extrapolação; negação de universal combinada com De Morgan; identificação do único caso falso da condicional (`V → F`).
- **Erro mapeado:** Q2, `confusao_conceitual` [C]. Ao negar “Nenhum analista utiliza o sistema legado”, foi marcada a alternativa “Todo analista utiliza”, que é mais forte do que a negação necessária. A negação correta exige apenas um contraexemplo: **algum analista utiliza**.
- **Diagnóstico clínico:** a falha ficou circunscrita à fronteira `nenhum → algum`. Não há evidência de colapso geral em Lógica nesta sessão. De Morgan, inferência categórica e condicional apareceram corretamente.
- **Ação:** não saturar com nova bateria exclusiva de quantificadores; reapresentar a fronteira de forma disfarçada em treino misto futuro.
- **Estudo:** [[3 - Materias/Logica/03 - quantificadores#Negação dos quantificadores|Negação dos quantificadores]].'''
          text = insert_after_heading(text, '## Diagnósticos de desempenho', logic_block, '### Diagnóstico de bateria mista — quantificadores, proposições e condicional (14/09/2026)')
          write(path, text)

          # Português
          path = '3 - Materias/Portugues/Avancos.md'
          text = update_frontmatter(read(path))
          text = insert_table_row(
              text,
              '## Volume diário de exercícios',
              '| 14/09/2026 | 6 | Língua Portuguesa | Ingestão de Inbox: 7 itens apresentados, 1 anulado por ausência de alternativa incorreta; 6 válidos, 5/6 acertos (83,3%). Acertos em haver/existir, `se` apassivador × indeterminação, crase, voz passiva e regência de `preferir`; erro em adversativa × concessiva [C]. |',
              '14/09/2026 | 6 | Língua Portuguesa'
          )
          text = ensure_weekly_section(
              text,
              '| **Semana 38** (14/09 a 20/09) | 6 | 83,3% (5/6) | Recuperação forte dos gargalos gramaticais recentes; reincidência específica em `contudo` × `embora`, com mudança de coordenação adversativa para subordinação concessiva e exigência do subjuntivo. |',
              '**Semana 38** (14/09 a 20/09) | 6 | 83,3% (5/6)'
          )
          port_block = '''### Diagnóstico de bateria mista de Português (14/09/2026)
- **Resultado:** 83,3% (5/6 acertos válidos). Uma questão foi anulada porque todas as alternativas estavam corretas e foi excluída do denominador.
- **Evidências positivas:** concordância de `haver`, `fazer`, `existir`, `faltar` e `bastar`; distinção entre partícula apassivadora e índice de indeterminação do sujeito; crase com nomes de lugar; voz passiva sintética; regência normativa de `preferir X a Y`.
- **Erro mapeado:** Q4, `confusao_conceitual` [C]. Na substituição de `contudo` por `embora`, foi mantida/invertida inadequadamente a arquitetura argumentativa. `Contudo` coordena oração adversativa; `embora` introduz oração concessiva subordinada e, no caso, exige `tenha ampliado`.
- **Diagnóstico clínico:** reincidência de uma fronteira já registrada no Simulado 02. O problema é de recuperação/aplicação, não ausência de teoria.
- **Ação:** manter interpretação em nível alto e reapresentar `adversativa × concessiva` de forma misturada, sem retorno à teoria básica.
- **Estudo:** [[3 - Materias/Portugues/03 - pontuacao e virgula#Coordenação adversativa × subordinação concessiva|Coordenação adversativa × subordinação concessiva]].'''
          text = insert_after_heading(text, '## Diagnósticos de desempenho', port_block, '### Diagnóstico de bateria mista de Português (14/09/2026)')
          write(path, text)

          # Comunicação
          path = '3 - Materias/Comunicacao/Avancos.md'
          text = update_frontmatter(read(path))
          text = insert_table_row(
              text,
              '## Volume diário de exercícios',
              '| 14/09/2026 | 7 | Comunicação Social | Ingestão de Inbox: bateria FGV de Schein, Kunsch, teorias do jornalismo, assessoria/media training e finalidade predominante: 6/7 (85,7%). Erro único em clipping × auditoria de imagem [C]. |',
              '14/09/2026 | 7 | Comunicação Social'
          )
          text = ensure_weekly_section(
              text,
              '| **Semana 38** (14/09 a 20/09) | 7 | 85,7% (6/7) | Desempenho alto em autores, taxonomias e aplicação profissional. Falha de fronteira entre etapa de coleta (`clipping`) e análise longitudinal estruturada (`auditoria de imagem na mídia`). |',
              '**Semana 38** (14/09 a 20/09) | 7 | 85,7% (6/7)'
          )
          comm_block = '''### Diagnóstico de bateria FGV — autores, teorias do jornalismo e assessoria (14/09/2026)
- **Resultado:** 85,7% (6/7 acertos).
- **Evidências positivas:** Schein (pressupostos básicos subjacentes); comunicação integrada em Kunsch; `newsmaking` como rotinas produtivas; separação entre gatekeeping, framing, agenda-setting e espiral do silêncio; `bridging` sem evasão; classificação mercadológica pela finalidade predominante mesmo em emissor público.
- **Erro mapeado:** Q5, `confusao_conceitual` [C]. Foi escolhido `clipping` para uma análise de oito meses que comparava temas, veículos, fontes, concorrentes e padrões de exposição. O erro deslocou uma definição verdadeira para a etapa imediatamente anterior.
- **Fronteira:** clipping = coleta e organização; análise = interpretação; auditoria de imagem na mídia = leitura estruturada e abrangente da cobertura ao longo de período mais amplo.
- **Diagnóstico clínico:** a teoria já estava no vault; trata-se de falha de recuperação em fronteira conceitual de alta plausibilidade para a FGV.
- **Ação:** reapresentar futuramente a distinção em caso prático, sem reestudo passivo do artigo inteiro.
- **Estudo:** [[3 - Materias/Comunicacao/08 - assessoria de imprensa#6. Clipping, análise tópica e auditoria de imagem|Clipping, análise tópica e auditoria de imagem]].'''
          text = insert_after_heading(text, '## Diagnósticos de desempenho', comm_block, '### Diagnóstico de bateria FGV — autores, teorias do jornalismo e assessoria (14/09/2026)')
          write(path, text)

          # Atualidades
          path = '3 - Materias/Atualidades/Avancos.md'
          text = update_frontmatter(read(path))
          text = insert_table_row(
              text,
              '## Volume diário de exercícios',
              '| 14/09/2026 | 3 | Atualidades / IA | Bateria contextual de economia, mercados de carbono e segurança internacional de IA: 2/3 (66,7%). Erro em regime de metas/Selic/Copom [K]; acertos em mercado de carbono e coexistência entre competição estratégica e cooperação em segurança de IA. |',
              '14/09/2026 | 3 | Atualidades / IA'
          )
          text = insert_table_row(
              text,
              '## Aproveitamento semanal',
              '| **Semana 38** (14/09 a 20/09) | 3 | 66,7% (2/3) | IA/geopolítica e mercado de carbono resolvidos por compreensão; lacuna factual concentrada em economia básica: meta central × faixa de tolerância × descumprimento formal e relação não automática entre IPCA e Selic. |',
              '**Semana 38** (14/09 a 20/09) | 3 | 66,7% (2/3)'
          )
          atual_block = '''### Diagnóstico de bateria contextual — economia, clima e segurança de IA (14/09/2026)
- **Resultado:** 66,7% (2/3 acertos).
- **Erro mapeado:** Q1, `conhecimento` [K]. Foi marcada a existência de queda automática da Selic na mesma proporção de uma queda do IPCA. A política monetária não opera por regra mecânica desse tipo.
- **Lacuna exata:** regime de metas contínuas; meta central de 3,0% × faixa de tolerância de 1,5% a 4,5%; critério de seis meses consecutivos fora da faixa para descumprimento formal; papel do Copom; fatores temporários de inflação e relação não automática entre IPCA e Selic.
- **Evidências positivas:** compreensão correta do papel econômico de créditos de carbono sem tratá-los como substitutos automáticos de redução direta; interpretação correta de que competição tecnológica e cooperação internacional em segurança de IA podem coexistir.
- **Ação:** a lacuna já foi transformada em nota teórica e snapshot conjuntural; revisar por questões, não por releitura extensa.
- **Estudo:** [[3 - Materias/Atualidades/03 - regime de metas inflacao selic copom#Tensões e pegadinhas|Regime de metas, inflação, Selic e Copom]].'''
          text = insert_after_heading(text, '## Diagnósticos de desempenho', atual_block, '### Diagnóstico de bateria contextual — economia, clima e segurança de IA (14/09/2026)')
          write(path, text)

          # Legislação / Informática: cria Avancos local inexistente
          info_path = Path('3 - Materias/Informatica/Avancos.md')
          if not info_path.exists():
              info_path.write_text('''---
title: "Avanços e desempenho (Legislação / Informática)"
type: "hub"
status: "ativo"
created: 2026-09-14
updated: 2026-09-14
---

# Avanços e desempenho (Legislação / Informática)

## Volume diário de exercícios

| Data | Quantidade | Matéria | Detalhamento / Blocos |
| :--- | :--- | :--- | :--- |
| 14/09/2026 | 4 | Legislação | Ingestão de Inbox: art. 154-A vigente, LGPD — dados sensíveis, Marco Civil — guarda de registros e sanções da LGPD: 4/4 (100%). |

## Aproveitamento semanal

| Semana / Período | Questões | Aproveitamento | Evolução / Análise de Progresso |
| :--- | :--- | :--- | :--- |
| **Semana 38** (14/09 a 20/09) | 4 | 100% (4/4) | Domínio integral das quatro fronteiras cobradas; principal ganho foi consolidar a redação vigente do art. 154-A após a Lei 14.155/2021. |

---

## Diagnósticos de desempenho

### Bateria de Legislação Dataprev (14/09/2026)
- **Resultado:** 100% (4/4 acertos).
- **Art. 154-A do Código Penal:** reconhecida a redação vigente, que alcança dispositivo de uso alheio conectado ou não à rede e não mantém no caput a antiga exigência de violação de mecanismo de segurança.
- **LGPD — dados sensíveis:** reconhecida a existência de hipóteses legais de tratamento sem consentimento; legítimo interesse não é base geral para dados sensíveis.
- **Marco Civil da Internet:** registro de conexão por 1 ano e, nas hipóteses legais do art. 15, registro de acesso a aplicações por 6 meses; guarda legal não depende de ordem judicial prévia.
- **LGPD — sanções:** advertência integra o rol de sanções e reincidência participa da dosimetria sem automatismo de multa máxima.
- **Diagnóstico clínico:** nenhum erro. A bateria serviu como validação de retenção e revelou, no próprio vault, a necessidade de manter explícita a distinção entre redação original de 2012 e redação vigente do art. 154-A, já incorporada à nota teórica.
- **Estudo:** [[3 - Materias/Informatica/02 - lei 12737 delitos informaticos|Lei 12.737/2012 — delitos informáticos]], [[3 - Materias/Informatica/01 - marco civil da internet|Marco Civil da Internet]] e [[3 - Materias/Comunicacao/03 - lai lgpd e transparencia|LAI, LGPD e transparência]].
''', encoding='utf-8')
          else:
              text = update_frontmatter(info_path.read_text(encoding='utf-8'))
              text = insert_table_row(text, '## Volume diário de exercícios', '| 14/09/2026 | 4 | Legislação | Ingestão de Inbox: art. 154-A vigente, LGPD — dados sensíveis, Marco Civil — guarda de registros e sanções da LGPD: 4/4 (100%). |', '14/09/2026 | 4 | Legislação')
              info_path.write_text(text, encoding='utf-8')

          # Indexa Avancos e Lei 12.737 em Informática
          path = 'index.md'
          text = read(path)
          base = '- [[3 - Materias/Informatica/informatica|Informatica]]\n  - [[3 - Materias/Informatica/01 - marco civil da internet|01 • Marco Civil da Internet]]'
          expanded = '- [[3 - Materias/Informatica/informatica|Informatica]]\n  - [[3 - Materias/Informatica/Avancos|Avanços e desempenho]]\n  - [[3 - Materias/Informatica/01 - marco civil da internet|01 • Marco Civil da Internet]]\n  - [[3 - Materias/Informatica/02 - lei 12737 delitos informaticos|02 • Lei 12.737/2012 — delitos informáticos]]'
          if '[[3 - Materias/Informatica/Avancos|Avanços e desempenho]]' not in text:
              if base not in text:
                  raise SystemExit('Âncora de Informática não encontrada em index.md')
              text = text.replace(base, expanded, 1)
          elif '[[3 - Materias/Informatica/02 - lei 12737 delitos informaticos|' not in text:
              anchor = '  - [[3 - Materias/Informatica/01 - marco civil da internet|01 • Marco Civil da Internet]]'
              text = text.replace(anchor, anchor + '\n  - [[3 - Materias/Informatica/02 - lei 12737 delitos informaticos|02 • Lei 12.737/2012 — delitos informáticos]]', 1)
          write(path, text)

          # Avanços globais: registra sessão exata sem fabricar janela móvel incompleta
          path = '00 - Desempenho/00 Avancos globais.md'
          text = update_frontmatter(read(path))
          global_update = '''### Atualização incremental — 14/09/2026

> [!NOTE]
> A janela móvel de 30 dias do painel acima permanece certificada até 04/09/2026 nesta ingestão. O Simulado 02 não preservou no registro a distribuição por disciplina, então o deslocamento da janela para 14/09 não pode ser recalculado com precisão sem fabricar dados. A sessão de 14/09 está integralmente registrada abaixo, nos Avanços locais e no Log de saturação diária.

- **Sessão mista Dataprev:** 26 questões válidas, 22 acertos (**84,6% bruto**) e **TAP 84,4%**.
- **Lógica:** 5/6 (83,3%), erro [C] em `nenhum → algum`.
- **Português:** 5/6 válidas (83,3%), com 1 item anulado; erro [C] em adversativa × concessiva.
- **Legislação:** 4/4 (100%), validando art. 154-A vigente, LGPD e Marco Civil.
- **Comunicação:** 6/7 (85,7%), erro [C] em clipping × auditoria de imagem.
- **Atualidades / IA:** 2/3 (66,7%), erro [K] em regime de metas, Selic e Copom.
- **Inglês:** bloco apresentado no material de origem, mas sem respostas registradas; excluído de todas as métricas.'''
          if '### Atualização incremental — 14/09/2026' not in text:
              anchor = '### Análise de evolução recente'
              if anchor not in text:
                  raise SystemExit('Âncora de análise recente não encontrada em Avanços globais')
              text = text.replace(anchor, global_update + '\n\n' + anchor, 1)
          recent = '- **Sessão mista Dataprev — 14/09**: 26 questões válidas, 22/26 acertos (84,6% bruto; TAP 84,4%). O padrão clínico foi estreito: três confusões conceituais de fronteira (Lógica, Português e Comunicação) e uma lacuna de conhecimento em economia básica/Atualidades; Legislação fechou 4/4. O bloco de Inglês não entrou nas métricas porque o arquivo de origem não contém respostas.\n'
          if '**Sessão mista Dataprev — 14/09**' not in text:
              anchor = '### Análise de evolução recente\n'
              text = text.replace(anchor, anchor + recent, 1)
          text = insert_table_row(
              text,
              '## Acompanhamento semanal de saturação e volume',
              '| **Semana 38** (14/09 a 20/09) | 26 | 84,6% (22/26) | 84,4% | **Média**: sessão mista em cinco disciplinas. Lógica 5/6; Português 5/6 válidas (1 anulada); Legislação 4/4; Comunicação 6/7; Atualidades/IA 2/3. Quatro falhas úteis: três [C] de fronteira conceitual e uma [K] em economia básica. Inglês não contabilizado por ausência de respostas no material de origem. |',
              '**Semana 38** (14/09 a 20/09) | 26 | 84,6% (22/26)'
          )
          write(path, text)

          # Log diário de saturação
          path = '00 - Desempenho/01 Log de saturacao diaria.md'
          text = update_frontmatter(read(path))
          text = insert_table_row(
              text,
              '## Log de Saturação Diária',
              '| 14/09/2026 | 26 | 84,6% (22/26) | 84,4% | **Média**: sessão mista Dataprev em cinco disciplinas, sem sintomas de fadiga registrados na fonte. Lógica 5/6 (83,3%; [C] negação de “nenhum”); Português 5/6 válidas (83,3%; 1 anulada; [C] adversativa × concessiva); Legislação 4/4 (100%); Comunicação 6/7 (85,7%; [C] clipping × auditoria de imagem); Atualidades/IA 2/3 (66,7%; [K] regime de metas/Selic/Copom). Inglês excluído porque as questões foram apresentadas, mas não houve respostas registradas. |',
              '14/09/2026 | 26 | 84,6% (22/26) | 84,4%'
          )
          write(path, text)

          # Log geral do vault
          path = 'log.md'
          text = read(path)
          log_marker = '## 2026-09-14 — Ingestão de desempenho Dataprev'
          if log_marker not in text:
              text += '''\n\n## 2026-09-14 — Ingestão de desempenho Dataprev\n\n- Processado o material de ingestão de 14/09/2026 para os arquivos de Avanços.\n- Sessão consolidada: **26 questões válidas, 22 acertos (84,6%)**, com **TAP de 84,4%**.\n- Registrados quatro erros clínicos: Lógica `confusao_conceitual` (`nenhum → algum`); Português `confusao_conceitual` (adversativa × concessiva); Comunicação `confusao_conceitual` (clipping × auditoria de imagem); Atualidades `conhecimento` (regime de metas, IPCA, Selic e Copom).\n- Legislação: 4/4, com validação da redação vigente do art. 154-A, dados sensíveis na LGPD, prazos de guarda do Marco Civil e sanções da LGPD.\n- Criado `[[3 - Materias/Informatica/Avancos|Avanços de Legislação / Informática]]` e indexada a nota `[[3 - Materias/Informatica/02 - lei 12737 delitos informaticos|Lei 12.737/2012 — delitos informáticos]]`.\n- O bloco de Inglês foi excluído das métricas por não possuir respostas no material de origem.\n- A janela móvel global de 30 dias não foi recalculada: a distribuição por disciplina do Simulado 02 continua ausente no registro canônico, impedindo recálculo preciso após o deslocamento da janela.\n'''
              write(path, text)
          PY

      - name: Validate patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          checks = {
              '3 - Materias/Logica/Avancos.md': '14/09/2026 | 6 | Raciocínio Lógico',
              '3 - Materias/Portugues/Avancos.md': '14/09/2026 | 6 | Língua Portuguesa',
              '3 - Materias/Comunicacao/Avancos.md': '14/09/2026 | 7 | Comunicação Social',
              '3 - Materias/Atualidades/Avancos.md': '14/09/2026 | 3 | Atualidades / IA',
              '3 - Materias/Informatica/Avancos.md': '14/09/2026 | 4 | Legislação',
              '00 - Desempenho/00 Avancos globais.md': '22/26 acertos (84,6% bruto; TAP 84,4%)',
              '00 - Desempenho/01 Log de saturacao diaria.md': '14/09/2026 | 26 | 84,6% (22/26) | 84,4%',
              'index.md': '[[3 - Materias/Informatica/Avancos|Avanços e desempenho]]',
              'log.md': '## 2026-09-14 — Ingestão de desempenho Dataprev',
          }
          for path, needle in checks.items():
              text = Path(path).read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'Validação falhou em {path}: {needle}')
          print('Validação da ingestão concluída com sucesso.')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
