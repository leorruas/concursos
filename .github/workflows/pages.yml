name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar contrato de mudança
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/validate-change-contract.js
      - name: Testar idempotência da ingestão
        run: node scripts/test-ingestion-idempotency.js
      - name: Validar invariantes globais do vault
        run: node scripts/validate-vault-invariants.js
      - name: Validar integridade dos dados e links
        run: node scripts/validate-integrity.js
      - name: Montar artefato estático isolado (_site)
        run: node scripts/build-site.js
      - name: Validar índice de busca publicado
        run: node scripts/validate-search-index.js
      - name: Testar recall mínimo da busca
        run: node scripts/test-search-index.js
      - name: Auditar ausência de arquivos privados em _site
        run: node scripts/validate-integrity.js --audit-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar catálogo publicado no Pages
        run: node scripts/verify-live-pages.js "${{ steps.deployment.outputs.page_url }}"
