name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar contrato de mudança
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node scripts/validate-change-contract.js
      - name: Testar idempotência da ingestão
        run: node scripts/test-ingestion-idempotency.js
      - name: Testar política pedagógica de questões
        run: node scripts/test-question-ingestion-policy.js
      - name: Testar política de propagação da ingestão
        run: node scripts/test-ingestion-propagation-policy.js
      - name: Testar transações multi-arquivo
        run: node scripts/test-changeset-transaction.js
      - name: Validar invariantes globais do vault
        run: node scripts/validate-vault-invariants.js
      - name: Validar integridade dos dados e links
        run: node scripts/validate-integrity.js
      - name: Montar artefato estático isolado (_site)
        run: node scripts/build-site.js
      - name: Validar índice de busca publicado
        run: node scripts/validate-search-index.js
      - name: Testar recall mínimo da busca
        run: node scripts/test-search-index.js
      - name: Testar deep links da busca
        run: node scripts/test-search-routing.js
      - name: Testar ranking real da busca
        run: node scripts/test-search-ranking.js
      - name: Auditar ausência de arquivos privados em _site
        run: node scripts/validate-integrity.js --audit-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        name: Publicar no Pages — tentativa 1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Aguardar antes de retry do Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment_retry
        name: Publicar no Pages — tentativa 2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Validar publicação no Pages
        if: always()
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ] && [ "${{ steps.deployment_retry.outcome }}" != "success" ]; then
            echo "Falha nas duas tentativas de deploy do GitHub Pages."
            exit 1
          fi
      - name: Confirmar catálogo publicado no Pages
        env:
          PAGE_URL: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-pages.js "$PAGE_URL"
