name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cada publicação em execução termina antes da próxima, evitando cancelamento de deploy em andamento.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testar leitura autenticada opcional sem tokens no navegador
        run: node scripts/test-priority-sync.js
      - name: Validar catálogo de flashcards públicos
        run: node scripts/validate-flashcards.js
      - name: Testar identidade e compatibilidade dos artigos
        run: node scripts/test-article-identity.js
      - name: Testar catálogo de matérias por concurso
        run: node scripts/test-contest-catalog.js
      - name: Testar filtro da grade por concurso
        run: node scripts/test-contest-home-filter.js
      - name: Testar filtro de artigos por concurso
        run: node scripts/test-contest-article-filter.js
      - name: Testar busca contextual por concurso
        run: node scripts/test-contest-search-scope.js
      - name: Testar home sem desempenho em provas
        run: node scripts/test-home-without-provas.js
      - name: Testar transações multi-arquivo
        run: node scripts/test-changeset-transaction.js
      - name: Validar governança da busca
        run: node scripts/validate-search-governance.js
      - name: Montar artefato estático isolado (_site)
        run: node scripts/build-site.js
      - name: Auditar dados pessoais fora da publicação
        run: node scripts/test-public-privacy.js
      - name: Validar publicação dos flashcards
        run: node scripts/validate-flashcards.js --site
      - name: Verificar projetos publicados de concursos
        run: node scripts/test-public-projects.js
      - name: Validar índice de busca publicado
        run: node scripts/validate-search-index.js
      - name: Testar recall mínimo da busca
        run: node scripts/test-search-index.js
      - name: Testar deep links da busca
        run: node scripts/test-search-routing.js
      - name: Testar ordenação dos hubs das matérias
        run: node scripts/test-hub-ordering.js
      - name: Testar wikilinks em tabelas Markdown
        run: node scripts/test-wikilinks-tables.js
      - name: Testar renderização de matemática em bloco
        run: node scripts/test-math-rendering.js
      - name: Testar ranking real da busca
        run: node scripts/test-search-ranking.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - id: deployment
        name: Publicar no Pages — tentativa 1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Aguardar antes de retry do Pages
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - id: deployment_retry
        name: Publicar no Pages — tentativa 2
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # Falha nos testes já reprova o job; conferir deploy apenas se foi tentado.
      - name: Validar publicação no Pages
        if: always() && (steps.deployment.outcome == 'success' || steps.deployment.outcome == 'failure')
        run: |
          if [ "${{ steps.deployment.outcome }}" != "success" ] && [ "${{ steps.deployment_retry.outcome }}" != "success" ]; then
            echo "Falha nas duas tentativas de deploy do GitHub Pages."
            exit 1
          fi
      - name: Confirmar catálogo publicado no Pages
        env:
          PAGE_URL: ${{ steps.deployment_retry.outputs.page_url || steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-pages.js "$PAGE_URL"
