name: Validar candidato à main

on:
  push:
    branches:
      - 'codex/preflight/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight público
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/preflight-vault.js
      - run: node scripts/test-public-question-shards.mjs
