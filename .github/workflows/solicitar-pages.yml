name: Solicitar republicação do Pages
on:
  pull_request:
    paths:
      - '.github/workflows/solicitar-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  republicar:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publicar somente o main atual
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run pages.yml --ref main
          sleep 6
          gh run list --workflow pages.yml --limit 5 --json databaseId,status,conclusion,headSha,createdAt

