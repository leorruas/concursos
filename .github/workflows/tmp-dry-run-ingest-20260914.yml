name: Dry-run ingestion 20260914

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-dry-run-ingest-20260914.yml'

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run canonical dry-run attempt 2
        run: node scripts/ingest-safe.js --input "00 inbox/00 ingestão.md" --type simulado --dry-run
