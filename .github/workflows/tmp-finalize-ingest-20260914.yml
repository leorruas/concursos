name: Finalize ingestion 20260914

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/tmp_finalize_ingest_20260914.py'
      - '.github/workflows/tmp-finalize-ingest-20260914.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply final repairs
        run: python scripts/tmp_finalize_ingest_20260914.py

      - name: Validate vault integrity
        run: node scripts/validate-integrity.js

      - name: Commit result and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '00 - Desempenho/00 Avancos globais.md' '00 - Desempenho/Simulados/00 - Catalogo de simulados.md' index.md
          git rm scripts/tmp_finalize_ingest_20260914.py
          git rm .github/workflows/tmp-finalize-ingest-20260914.yml
          git commit -m "Finaliza catálogo e integridade da ingestão de 14/09"
          git pull --rebase origin main
          git push
