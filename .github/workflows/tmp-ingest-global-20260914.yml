name: Apply global ingestion 20260914

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/tmp_ingest_global_20260914.py'
      - '.github/workflows/tmp-ingest-global-20260914.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply update
        run: python scripts/tmp_ingest_global_20260914.py

      - name: Commit result and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '00 - Desempenho/00 Avancos globais.md' '00 - Desempenho/01 Log de saturacao diaria.md' '4 - Projetos/dataprev-2026/O que estudar.md' '4 - Projetos/dataprev-2026/00 Dashboard.md' index.md log.md
          git rm scripts/tmp_ingest_global_20260914.py
          git rm .github/workflows/tmp-ingest-global-20260914.yml
          git commit -m "Consolida ingestão Dataprev de 14/09"
          git pull --rebase origin main
          git push
