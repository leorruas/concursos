name: Apply logic ingestion 20260914

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/tmp_ingest_logica_20260914.py'
      - '.github/workflows/tmp-ingest-logica-20260914.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply update
        run: python scripts/tmp_ingest_logica_20260914.py

      - name: Commit result and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '3 - Materias/Logica/Avancos.md'
          git rm scripts/tmp_ingest_logica_20260914.py
          git rm .github/workflows/tmp-ingest-logica-20260914.yml
          git commit -m "Atualiza avanços de Lógica em 14/09"
          git push
