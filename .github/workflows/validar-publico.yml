name: Validar site público (PR)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-priority-sync.js && node scripts/test-progress-sync.js
      - run: node scripts/test-camara-questions.js
      - run: node scripts/test-camara-expansion.js
      - run: node scripts/test-camara-difficulty.js && node scripts/test-camara-discursivas.js
      - run: node scripts/validate-flashcards.js
      - run: node scripts/test-article-identity.js
      - run: node scripts/validate-vault-invariants.js --public-only
      - run: node scripts/test-contest-catalog.js && node scripts/test-contest-home-filter.js && node scripts/test-contest-article-filter.js && node scripts/test-contest-search-scope.js
      - run: node scripts/validate-search-governance.js
      - run: node scripts/build-site.js
      - run: node scripts/test-public-privacy.js && node scripts/validate-flashcards.js --site && node scripts/test-public-projects.js && node scripts/test-glossary.js && node scripts/test-glossary-flashcards.js
      - run: node scripts/validate-search-index.js && node scripts/test-search-index.js && node scripts/test-search-routing.js && node scripts/test-search-ranking.js
