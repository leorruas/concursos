name: Validar site público (PR)
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-priority-sync.js && node scripts/test-progress-sync.js
      - name: Auditar referencias editoriais
        run: node scripts/auditar-referencias-editoriais.mjs --json referencias-editoriais.json --strict
      - name: Publicar relatorio da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-referencias-editoriais
          path: referencias-editoriais.json
          if-no-files-found: ignore
      - run: node scripts/audit-camara-reference-headings.js
      - run: node scripts/test-camara-questions.js
      - run: node scripts/test-camara-expansion.js
      - run: node scripts/test-camara-difficulty.js && node scripts/test-camara-discursivas.js
      - run: node scripts/validate-flashcards.js
      - run: node scripts/test-article-identity.js
      - run: node scripts/validate-vault-invariants.js --public-only
      - run: node scripts/test-contest-catalog.js && node scripts/test-contest-home-filter.js && node scripts/test-contest-article-filter.js && node scripts/test-contest-search-scope.js
      - run: node scripts/test-home-without-provas.js
      - run: node scripts/validate-search-governance.js
      - run: node scripts/build-site.js
      - run: node scripts/test-public-privacy.js && node scripts/validate-flashcards.js --site && node scripts/test-public-projects.js && node scripts/test-glossary.js && node scripts/test-glossary-flashcards.js && node scripts/test-multi-glossary.js
      - run: node scripts/validate-search-index.js && node scripts/test-search-index.js && node scripts/test-search-routing.js && node scripts/test-search-ranking.js && node scripts/test-results-deeplinks.js
