name: Validar glossário antes de integrar
on:
  pull_request:
    paths:
      - 'data/glossario/**'
      - 'scripts/glossary-*.js'
      - 'scripts/test-glossary*.js'
      - 'scripts/test-glossary-browser.cjs'
      - 'scripts/build-site.js'
      - 'index.html'
      - 'style.css'
      - 'web/**'
      - '.github/workflows/validate-glossary-pr.yml'
      - 'web/09-glossary.js'
      - 'style.css'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar catálogo e gerar o site sem publicar
        run: node scripts/build-site.js
      - name: Testar integridade, rotas e busca do glossário
        run: node scripts/test-glossary.js
      - name: Testar flashcards derivados do glossário
        run: node scripts/test-glossary-flashcards.js
      - name: Verificar dados pessoais fora do site
        run: node scripts/test-public-privacy.js
      - name: Instalar navegador de teste
        run: |
          npm install --no-save --ignore-scripts --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Testar interface e gerar evidências em duas larguras
        timeout-minutes: 5
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _site >/tmp/glossario-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 --max-time 2 http://127.0.0.1:8765/ >/dev/null
          timeout --signal=TERM --kill-after=10s 180s node scripts/test-glossary-browser.cjs
      - name: Anexar capturas do glossário
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: capturas-glossario
          path: glossary-visual-evidence/
          if-no-files-found: ignore
