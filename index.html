<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>concursos • leorruas</title>
    <link rel="stylesheet" href="style.css?v=comments-v2">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>

<body>
    <nav class="sticky-nav" id="sticky-nav">
        <span class="nav-logo" id="nav-logo">concursos • leorruas</span>
        <div class="nav-search-wrapper">
            <label class="nav-search-container" for="nav-search-input">
                <span class="sr-only">Pesquisar nas matérias</span>
                <input type="search" id="nav-search-input" placeholder="pesquisar... (atalho /)" autocomplete="off">
            </label>
            <button type="button" class="btn-limpar-busca escondido" id="btn-limpar-nav" aria-label="Limpar pesquisa">&times;</button>
        </div>
        <div class="nav-acoes">
            <a href="#explorar-disciplinas" class="nav-link-pastas" id="nav-link-pastas">índice</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema">modo claro</button>
        </div>
    </nav>

    <header class="page-masthead" id="page-masthead">
        <section class="busca-principal" aria-label="Pesquisar nas matérias">
            <div class="busca-campo">
                <label class="sr-only" for="main-search-input">Pesquisar por assunto ou disciplina</label>
                <input type="search" id="main-search-input" placeholder="pesquisar nas matérias... (pressione / para focar)" autocomplete="off">
                <button type="button" class="btn-limpar-busca escondido" id="btn-limpar-main" aria-label="Limpar pesquisa">&times;</button>
            </div>
        </section>
        <div class="masthead-copy">
            <h1 id="home-title"><span>concursos</span><small>dataprev & tcdf</small></h1>
            <p>caderno digital, simulados e repositório de estudos</p>
        </div>
    </header>

    <main>
        <!-- Camada Estratégica do Concurso Ativo (Visível exclusivamente na Home) -->
        <section class="concurso-home-bloco escondido" id="painel-concurso-home" aria-labelledby="concurso-home-titulo">
            <h2 id="concurso-home-titulo" class="sr-only">Painel do Concurso</h2>
            <div id="concurso-home-conteudo"></div>
        </section>

        <!-- Seção de Simulados & Desempenho (Acima das Matérias) -->
        <section class="orientacoes-iniciais" id="orientacoes-iniciais" aria-labelledby="orientacoes-iniciais-titulo">
            <h2 id="orientacoes-iniciais-titulo" class="sr-only">Simulados e Desempenho</h2>
            <div class="pastas-container pastas-orientacao" id="orientacoes-container">
                <!-- Cards de Simulados e Dashboards gerados dinamicamente -->
            </div>
        </section>

        <!-- Grade Suíça de Matérias -->
        <section class="explorar-disciplinas" id="explorar-disciplinas" aria-labelledby="disciplinas-titulo">
            <h2 id="disciplinas-titulo">matérias...</h2>
            <div class="pastas-container" id="pastas-container">
                <!-- Os cards suíços das matérias serão gerados aqui dinamicamente -->
            </div>
        </section>

        <!-- Resultados da Busca -->
        <div class="resultados escondido" id="resultados">
            <div class="cards-container">
                <!-- Resultados da busca agrupados -->
            </div>
        </div>

        <!-- Visualizador da Disciplina (Ações / Lista de Artigos) -->
        <section class="disciplina-leitor escondido" id="disciplina-leitor" aria-live="polite">
            <nav class="artigo-breadcrumbs" id="disciplina-breadcrumbs" aria-label="Caminho de navegação"></nav>
            <div class="disciplina-cabecalho" id="disciplina-cabecalho"></div>
            <div class="disciplina-acoes" id="disciplina-acoes"></div>
            <button id="btn-voltar-disciplina" class="btn-voltar">&larr; voltar para as matérias</button>
        </section>

        <!-- Leitor de Artigo Individual -->
        <div class="leitor-artigo escondido" id="leitor-artigo">
            <div class="artigo-layout-container">
                <!-- Table of Contents (TOC) no Lado Esquerdo -->
                <aside class="artigo-toc-sidebar" id="artigo-toc-sidebar">
                    <div class="toc-header">
                        <span class="toc-title">Neste artigo</span>
                    </div>
                    <div class="toc-filter-container" id="toc-filter-container">
                        <input type="search" id="toc-filter-input" placeholder="filtrar seções..." autocomplete="off">
                    </div>
                    <nav class="toc-nav" id="toc-nav"></nav>
                </aside>

                <div class="artigo-conteudo-wrapper">
                    <nav class="artigo-breadcrumbs" id="artigo-breadcrumbs"></nav>
                    <h2 id="artigo-titulo"></h2>
                    <div class="artigo-contexto" id="artigo-contexto" hidden></div>
                    <div id="artigo-corpo" class="artigo-corpo"></div>
                    <nav class="artigo-nav-cards" id="artigo-nav-rodape" aria-label="Navegação entre artigos"></nav>
                    <div class="retorno-artigo">
                        <p id="retorno-artigo-texto">quer continuar estudando?</p>
                        <button id="btn-voltar" class="btn-voltar">&larr; voltar para a matéria</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js?v=comments-v1"></script>
</body>

</html>
